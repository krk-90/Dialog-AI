services:
  # FastAPI backend only. The React/Vite frontend is deployed separately on Vercel.
  - type: web
    name: dialog-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Replace this temporary local origin after deploying the frontend to Vercel.
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173
      - key: DIALOG_AI_LOCAL_HISTORY
        value: "false"
      - key: DIALOG_AI_DB_PATH
        value: /tmp/dialog-ai.sqlite3
